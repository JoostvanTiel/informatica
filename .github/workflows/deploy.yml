name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the book
        run: |
          echo "Starting build..."
          jupyter-book build book/ 2>&1 || true
          echo "Build completed or failed"
          find book -type d -name "_build" || echo "No _build directory found"
          ls -la book/ || echo "Cannot list book directory"

      - name: Check build output
        run: |
          if [ -d "book/_build/html" ]; then
            echo "✓ Build directory exists"
            ls -la book/_build/html
          else
            echo "✗ Build directory NOT found!"
            if [ -d "book/_build" ]; then
              echo "Contents of book/_build:"
              ls -la book/_build/
            else
              echo "book/_build/ directory doesn't exist either"
            fi
            ls -la book/
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
